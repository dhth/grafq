[package]
name = "grafq"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dhth/grafq"
description = "query Neo4j/AWS Neptune databases via an interactive console"
homepage = "https://github.com/dhth/grafq"
keywords = [
    "cli",
    "neo4j",
    "aws-neptune",
]
categories = [
    "command-line-utilities",
]
exclude = [
    ".github",
    "deny.toml",
    "justfile",
    "local",
]

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.7"
aws-sdk-neptunedata = "1.86.0"
aws-smithy-types = "1.4.5"
chrono = "0.4.44"
clap = { version = "4.5.56", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
etcetera = "0.11.0"
neo4rs = "0.8.0"
rustyline = { version = "17.0.2", default-features = false, features = ["with-file-history"] }
serde_json = "1.0.149"
shlex = "1.3.0"
tabled = "0.20"
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.2"

[dev-dependencies]
insta = { version = "1.46.2", features = ["yaml"] }
insta-cmd = "0.6.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dist]
inherits = "release"
